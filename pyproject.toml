[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "perag"
version = "0.1.6"
description = "Personal RAG toolkit for local document retrieval"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "markdown-it-py>=3",
    "sqlite-vec>=0.1.6",
    "sentence-transformers>=3",
    "pathspec>=0.12",
]

[project.scripts]
perag = "perag.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
python-preference = "system"
